name: env-test
on:
  push:
    branches: [env-test]
jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [broken, fixed]
    steps:
    - uses: actions/checkout@v4
    - name: Set vars
      run: |
        if [[ "${{ matrix.variant }}" == "fixed" ]]; then
            echo "OVERWRITE_ALL_CVE_DATA=1" >> "$GITHUB_ENV"
        else
            export OVERWRITE_ALL_CVE_DATA=1
        fi
    - name: Seed data dir (stands in for the GCS sync)
      run: |
        mkdir -p cve_data
        for m in 01 02 03 04 05 06 07 08; do : > "cve_data/2026-$m.json"; done
        echo 2026 > start_year
        ls -l cve_data
    - name: Install fetcher deps
      run: pip install aiohttp aio.run.runner
    - name: Run CVE fetcher
      run: |
        printf '#!/bin/bash\nexec python3 tools/dependency/cve_fetch.py "$@"\n' > fetcher.sh
        chmod +x fetcher.sh
        START_YEAR_PATH=start_year CVE_DATA_PATH=cve_data FETCHER=./fetcher.sh \
          tools/dependency/cve_update.sh
    - name: Result
      run: ls -l cve_data
